name: Controlled GitHub Pages end-to-end test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-e2e.yml
      - scripts/verify.py

permissions:
  contents: read

concurrency:
  group: deployproof-pages-e2e
  cancel-in-progress: false

jobs:
  build:
    name: Build synthetic test site
    # A manual workflow_dispatch on a feature branch must never overwrite Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      git_sha: ${{ steps.identity.outputs.git_sha }}
      workflow_run_id: ${{ steps.identity.outputs.workflow_run_id }}
      run_attempt: ${{ steps.identity.outputs.run_attempt }}
      build_id: ${{ steps.identity.outputs.build_id }}
    steps:
      - name: Generate public test files only
        id: identity
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          out = Path("_site")
          out.mkdir(exist_ok=True)
          sha = os.environ["BUILD_SHA"]
          run_id = os.environ["BUILD_RUN_ID"]
          attempt = os.environ["BUILD_RUN_ATTEMPT"]
          manifest = {
              "git_sha": sha,
              "workflow_run_id": run_id,
              "run_attempt": attempt,
              "build_id": f"{run_id}-{attempt}-{sha}",
          }
          (out / "deployproof.json").write_text(json.dumps(manifest), encoding="utf-8")
          (out / "index.html").write_text(
              "<!doctype html><html lang=\"en\"><meta charset=\"utf-8\">"
              "<title>DeployProof E2E test</title>"
              "<body><h1>DeployProof E2E test</h1>"
              "<p>Synthetic public test page. No personal data or source files.</p>"
              "</body></html>", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in manifest.items():
                  output.write(f"{key}={value}\n")
          print("Generated _site/index.html and _site/deployproof.json")
          PY

      - name: Upload synthetic Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy-and-verify:
    name: Deploy synthetic site and test positive and negative cases
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy test artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Check out the public Action source under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Positive control - latest published build must match
        id: positive
        uses: ./
        with:
          site-url: https://eluyz.github.io/deployproof/
          expected-sha: ${{ needs.build.outputs.git_sha }}
          expected-run-id: ${{ needs.build.outputs.workflow_run_id }}
          expected-run-attempt: ${{ needs.build.outputs.run_attempt }}
          expected-build-id: ${{ needs.build.outputs.build_id }}
          attempts: '20'
          delay-seconds: '15'
          timeout-seconds: '10'

      - name: Assert the positive verdict explicitly
        if: ${{ !cancelled() }}
        env:
          OBSERVED_VERDICT: ${{ steps.positive.outputs.verdict }}
        run: |
          if [ "$OBSERVED_VERDICT" != "IDENTITY_PASS" ]; then
            echo "Expected IDENTITY_PASS, got $OBSERVED_VERDICT" >&2
            exit 1
          fi

      - name: Verify installation via a pinned remote Action reference
        id: remote_action
        uses: eluyz/deployproof@1c03c9d4ace3855bf12fc7672c6d6a60cc072b8f # Published v0.1.0 prerelease commit SHA
        with:
          site-url: https://eluyz.github.io/deployproof/
          expected-sha: ${{ needs.build.outputs.git_sha }}
          expected-run-id: ${{ needs.build.outputs.workflow_run_id }}
          expected-run-attempt: ${{ needs.build.outputs.run_attempt }}
          expected-build-id: ${{ needs.build.outputs.build_id }}
          attempts: '3'
          delay-seconds: '2'

      - name: Assert remote Action returned a positive verdict
        if: ${{ !cancelled() }}
        env:
          OBSERVED_VERDICT: ${{ steps.remote_action.outputs.verdict }}
        run: |
          if [ "$OBSERVED_VERDICT" != "IDENTITY_PASS" ]; then
            echo "Remote Action did not return IDENTITY_PASS: $OBSERVED_VERDICT" >&2
            exit 1
          fi

      - name: Negative control - wrong build ID must fail
        id: wrong_build
        continue-on-error: true
        uses: ./
        with:
          site-url: https://eluyz.github.io/deployproof/
          expected-sha: ${{ needs.build.outputs.git_sha }}
          expected-run-id: ${{ needs.build.outputs.workflow_run_id }}
          expected-run-attempt: ${{ needs.build.outputs.run_attempt }}
          expected-build-id: intentionally-wrong-build-id
          attempts: '1'

      - name: Assert exact wrong-build failure
        if: ${{ !cancelled() }}
        env:
          OBSERVED_OUTCOME: ${{ steps.wrong_build.outcome }}
          OBSERVED_VERDICT: ${{ steps.wrong_build.outputs.verdict }}
        run: |
          if [ "$OBSERVED_OUTCOME" != "failure" ] || [ "$OBSERVED_VERDICT" != "VERSION_MISMATCH" ]; then
            echo "Expected failed VERSION_MISMATCH; got outcome=$OBSERVED_OUTCOME verdict=$OBSERVED_VERDICT" >&2
            exit 1
          fi

      - name: Negative control - missing manifest must fail
        id: missing_manifest
        continue-on-error: true
        uses: ./
        with:
          site-url: https://eluyz.github.io/deployproof/
          manifest-path: missing-deployproof-e2e-test.json
          expected-sha: ${{ needs.build.outputs.git_sha }}
          expected-run-id: ${{ needs.build.outputs.workflow_run_id }}
          expected-run-attempt: ${{ needs.build.outputs.run_attempt }}
          expected-build-id: ${{ needs.build.outputs.build_id }}
          attempts: '1'

      - name: Assert exact missing-manifest failure
        if: ${{ !cancelled() }}
        env:
          OBSERVED_OUTCOME: ${{ steps.missing_manifest.outcome }}
          OBSERVED_VERDICT: ${{ steps.missing_manifest.outputs.verdict }}
        run: |
          if [ "$OBSERVED_OUTCOME" != "failure" ] || [ "$OBSERVED_VERDICT" != "MISSING_MANIFEST" ]; then
            echo "Expected failed MISSING_MANIFEST; got outcome=$OBSERVED_OUTCOME verdict=$OBSERVED_VERDICT" >&2
            exit 1
          fi
