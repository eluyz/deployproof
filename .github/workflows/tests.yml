name: Local verifier tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
      - name: Compile Python source
        run: python3 -m compileall -q scripts tests
      - name: Run unit and local HTTP integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Install YAML validator (CI only)
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate release workflow template
        run: python3 scripts/validate_release_example.py
